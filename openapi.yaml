  /gp-jammer/api/v1/sdrs/{sdr_alias}/interference:
    post:
      tags:
        - Interference Selection
      operationId: selectInterference
      summary: Select interference
      description: |
        Executes interference IQ data generation for the specified SDR using the
        provided parameter values.

        Query parameters `base` and `name` identify the interference.
        Take both values from `GET /interferences`.
        The JSON body provides interference-specific parameter values.

        Use `GET /gp-jammer/api/v1/interferences/info` to learn valid parameter
        names, types, and ranges for the selected interference.

        Success message format:
        `Successfully selected interference '<shortName>'`

        where `<shortName>` is the short interference name (for example `CHIRP`),
        not the full relative path from `GET /interferences`.

      parameters:
        - $ref: "#/components/parameters/SdrAlias"
        - $ref: "#/components/parameters/InterferenceBase"
        - $ref: "#/components/parameters/InterferenceName"
      requestBody:
        required: true
        description: |
          Interference-specific parameters. Field names depend on the selected
          interference. Use `GET /interferences/info` for names, types, and
          ranges.

          Values may be JSON numbers or numeric strings (for example
          `1575420000` or `"1575420000"`). Non-numeric strings and values
          outside the allowed range return `400` with
          `Following interference variables are out of range: '<field>'`.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Dynamic parameter map for the selected interference.
            examples:
              chirp:
                summary: CHIRP parameters
                value:
                  center_frequency: 1575420000
                  IQ_rate: 40000000
                  sweep_span: 20000000
                  sweep_period: 0.00001
              awgnChirp:
                summary: AWGN-Chirp parameters
                value:
                  center_frequency: 1585e6
                  IQ_rate: 56e6
                  noise_bandwidth: 10e6
                  signal_duration: 0.005
              awgn:
                summary: AWGN interference parameters
                value:
                  center_frequency: 1545000000
                  IQ_rate: 56000000
                  noise_bandwidth: 10000000
                  signal_duration: 0.005
      responses:
        "200":
          description: |
            Interference was selected and IQ data generation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                selectedChirp:
                  summary: Chirp selected
                  description: |
                    Query `name=Basic Modulations\CHIRP` (or `\Chirp`) with a
                    valid body. The message quotes the short library name
                    (`CHIRP` / `Chirp` depending on the file).
                  value:
                    status: ok
                    message: "Successfully selected interference 'Chirp'"
                selectedChirpNumericString:
                  summary: Chirp selected with numeric string field
                  description: |
                    `center_frequency` sent as `"6000000000"` (string) still
                    returns `200` when the value is in range.
                  value:
                    status: ok
                    message: "Successfully selected interference 'Chirp'"
        "400":
          description: |
            Missing required query parameters, or invalid request body.

            Query missing `base` / `name`: same messages as
            `GET /interferences/info`.

            Invalid body values — message format:
            `Following interference variables are out of range: '<field>'`
            (one or more field names).

            Observed for out-of-range numbers (for example
            `center_frequency: 60000000000`) and for non-numeric strings
            (for example `center_frequency: "bad"`).

            A numeric string such as `"6000000000"` is accepted and returns
            `200` (no separate invalid-type error for number-vs-string).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingBase:
                  summary: Missing base query parameter
                  value:
                    status: error
                    message: "Missing required parameters: base"
                missingName:
                  summary: Missing name query parameter
                  value:
                    status: error
                    message: "Missing required parameters: name"
                missingBaseAndName:
                  summary: Missing base and name
                  value:
                    status: error
                    message: "Missing required parameters: base, name"
                outOfRangeNumber:
                  summary: Numeric value outside allowed range
                  description: |
                    Example for `center_frequency: 60000000000`.
                  value:
                    status: error
                    message: "Following interference variables are out of range: 'center_frequency'"
                nonNumericString:
                  summary: Non-numeric string value
                  description: |
                    Example for `center_frequency: "bad"`. Same message as
                    out-of-range. A numeric string like `"6000000000"` is
                    accepted (`200`).
                  value:
                    status: error
                    message: "Following interference variables are out of range: 'center_frequency'"
        "401":
          description: Missing API key header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingApiKey:
                  summary: Missing API key header
                  value:
                    status: error
                    message: Missing GP-Jammer-API-Key
        "403":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidApiKey:
                  summary: Invalid API key
                  value:
                    status: error
                    message: Invalid GP-Jammer-API-Key
        "404":
          description: SDR alias or interference name not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                sdrNotFound:
                  summary: Unknown SDR alias in the path
                  value:
                    status: error
                    message: "SDR 'unknown alias' not found"
                interferenceNotFound:
                  summary: Unknown interference name in query
                  value:
                    status: error
                    message: "Interference 'Basic Modulations\\NoSuchThing' not found"
        "405":
          description: |
            Only `POST` is allowed on this endpoint.

            Message format: `Method <METHOD> not allowed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                methodGet:
                  summary: GET not allowed
                  value:
                    status: error
                    message: Method GET not allowed
                methodPut:
                  summary: PUT not allowed
                  value:
                    status: error
                    message: Method PUT not allowed
                methodDelete:
                  summary: DELETE not allowed
                  value:
                    status: error
                    message: Method DELETE not allowed
        "500":
          description: |
            Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal:
                  summary: Internal server error
                  value:
                    status: error
                    message: Internal error occurred. Check GP-Jammer App error log

