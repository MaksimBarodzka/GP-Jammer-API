components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: GP-Jammer-API-Key
      description: |
        API key from **SETTINGS -> API SERVER** in GP-Jammer.

        Required when Authorization Mode is **API key**.
        When **No Auth** is selected, requests work without this header.

        Click **Generate** to create a new key, then **APPLY**.

  parameters:
    SdrAlias:
      name: sdr_alias
      in: path
      required: true
      description: |
        SDR device alias returned in the `userAlias` field by
        `GET /gp-jammer/api/v1/sdrs`.

        URL-encode spaces and special characters.

        Example aliases:

        | Alias | Encoded path segment |
        | --- | --- |
        | `Pluto Alias 1` | `Pluto%20Alias%201` |
        | `Pluto Alias 2` | `Pluto%20Alias%202` |
        | `Pluto Alias` | `Pluto%20Alias` |

        Read current `userAlias` values from `GET /gp-jammer/api/v1/sdrs`.
      schema:
        type: string
      example: Pluto Alias 1

    InterferenceBase:
      name: base
      in: query
      required: true
      description: |
        Local interference library folder path from
        `GET /gp-jammer/api/v1/interferences` (`data[].base`).

        Use a `base` value from that list response. The path is
        installation-specific and can change with packs or machine.
      schema:
        type: string
      example: 'C:\Users\User\AppData\Local\GPSPATRON\GP-Jammer\Python data'

    InterferenceName:
      name: name
      in: query
      required: true
      description: |
        Interference name relative to `base`, from
        `GET /gp-jammer/api/v1/interferences` (`data[].names`).

        Use a `name` value from that list response. The set of names
        depends on the installed interference packs.
      schema:
        type: string
      example: Basic Modulations\AWGN-Chirp

  schemas:
    StatusOk:
      type: string
      enum:
        - ok
      example: ok

    StatusError:
      type: string
      enum:
        - error
      example: error

    InterferenceGroup:
      type: object
      required:
        - base
        - names
      properties:
        base:
          type: string
          description: Base path of an interference library folder.
          example: 'C:\Users\User\AppData\Local\GPSPATRON\GP-Jammer\Python data'
        names:
          type: array
          description: Interference names available under this base path.
          items:
            type: string
          example:
            - Basic Modulations\AWGN-Chirp
            - Basic Modulations\AWGN
            - GNSS\GPS-CA-L1-Signal-Matched

    InterferenceVariable:
      type: object
      description: |
        One interference parameter definition from
        `GET /interferences/info`.

        `default`, `min`, and `max` are strings (often scientific notation),
        even when `type` is `number`.
      required:
        - name
        - type
        - description
        - default
        - min
        - max
      properties:
        name:
          type: string
          description: Parameter key for the select-interference request body.
          example: center_frequency
        type:
          type: string
          description: "Parameter type (for example `number`)."
          example: number
        description:
          type: string
          example: Center frequency (Hz)
        default:
          type: string
          description: Default value as a string (for example `"1585e6"`).
          example: "1585e6"
        min:
          type: string
          description: Minimum allowed value as a string.
          example: "70e6"
        max:
          type: string
          description: Maximum allowed value as a string.
          example: "6e9"

    InterferenceInfo:
      type: object
      description: |
        Interference metadata returned by `GET /interferences/info`.
      required:
        - name
        - description
        - variables
      properties:
        name:
          type: string
          description: |
            Short interference name (for example `AWGN-Chirp`).
            This may differ from the relative path used in the `name` query
            parameter (`Basic Modulations\AWGN-Chirp`).
          example: AWGN-Chirp
        description:
          type: string
          example: Additive White Gaussian Noise (AWGN) complexly multiplied by the Chirp signal interference
        variables:
          type: array
          items:
            $ref: "#/components/schemas/InterferenceVariable"

    SdrListItem:
      type: object
      description: |
        SDR device connection and generation state as returned by
        `GET /gp-jammer/api/v1/sdrs`.
      required:
        - genStatus
        - userAlias
      properties:
        genStatus:
          type: boolean
          description: |
            Generation status for the device.

            - `false` - device is idle (generation not running)
            - `true` - signal generation is active
          example: false
        userAlias:
          type: string
          description: |
            Human-readable SDR alias. Use this value as `{sdr_alias}` in
            device-specific endpoints (URL-encode if needed).
          example: Pluto Alias

    SdrSettings:
      type: object
      description: |
        SDR configuration payload for `GET`/`PUT .../settings`.

        All three fields are required on `PUT`. Values must be JSON numbers
        (double), not strings.
      required:
        - IQ_rate
        - center_frequency
        - gain
      properties:
        IQ_rate:
          type: number
          format: double
          description: |
            IQ sample rate in Hz.

            Allowed range: between `2.083333M` and `61.44M`
            (approximately 2,083,333 Hz to 61,440,000 Hz).
            Out-of-range responses use mega-unit notation in the message.
          example: 56000000
        center_frequency:
          type: number
          format: double
          description: |
            Center frequency in Hz.

            Must be a JSON number (double).
          example: 1585000000
        gain:
          type: number
          format: double
          description: |
            Output gain in dB.

            Allowed range: `-89` to `0` inclusive.
            Values outside this range return `400` with
            `Invalid value for gain: must be between -89 and 0`.
          minimum: -89
          maximum: 0
          example: -50

    CurrentInterference:
      type: object
      description: |
        Currently selected interference for the SDR device.

        Parameter values inside `parameters` are returned as strings
        (scientific notation may appear, for example `"56e6"`).
      required:
        - base
        - name
        - parameters
      properties:
        base:
          type: string
          description: Local interference library folder path.
          example: 'C:\Users\User\AppData\Local\GPSPATRON\GP-Jammer\Python data'
        name:
          type: string
          description: Interference name relative to `base`.
          example: Basic Modulations\AWGN-Chirp
        parameters:
          type: object
          additionalProperties:
            type: string
          description: |
            Interference-specific parameters. Keys depend on the selected
            interference. Values are strings (not numbers).
          example:
            IQ_rate: "56e6"
            center_frequency: "1585e6"
            noise_bandwidth: "10e6"
            sweep_period: "5.000000e-05"
            sweep_span: "56e6"

    SdrInfo:
      type: object
      description: |
        Detailed SDR device payload returned by
        `GET /gp-jammer/api/v1/sdrs/{sdr_alias}`.
      required:
        - userAlias
        - id
        - firmwareVersion
        - genStatus
        - settings
      properties:
        userAlias:
          type: string
          description: Human-readable SDR alias.
          example: Pluto Alias
        id:
          type: string
          description: Device identifier.
          example: Pluto_D
        firmwareVersion:
          type: string
          description: SDR firmware version string.
          example: "1.1.5"
        genStatus:
          type: boolean
          description: |
            Generation status.

            - `false` - idle
            - `true` - generation running
          example: false
        settings:
          $ref: "#/components/schemas/SdrSettings"
        currentInterference:
          $ref: "#/components/schemas/CurrentInterference"

    LogEntry:
      type: object
      additionalProperties: true
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-07-15T10:00:00.000Z"
        channel:
          type: string
          example: Pluto Alias
        interference:
          type: string
          example: Basic Modulations\AWGN
        action:
          type: string
          example: Start
        info:
          type: string
          example: ""

    MessageResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        message:
          type: string
          example: "Updated settings for 'Pluto Alias 1'"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          $ref: "#/components/schemas/StatusError"
        message:
          type: string
          example: Invalid parameter value

    InterferenceListResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        data:
          type: array
          items:
            $ref: "#/components/schemas/InterferenceGroup"

    InterferenceInfoResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        data:
          $ref: "#/components/schemas/InterferenceInfo"

    SdrListResponse:
      type: object
      description: |
        Response containing all SDR devices visible to GP-Jammer.
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        data:
          type: array
          description: |
            Connected SDR devices. Empty when no devices are available.
          items:
            $ref: "#/components/schemas/SdrListItem"

    SdrInfoResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        data:
          $ref: "#/components/schemas/SdrInfo"

    SdrSettingsResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          $ref: "#/components/schemas/StatusOk"
        data:
          $ref: "#/components/schemas/SdrSettings"

    GenerationLogResponse:
      type: array
      description: List of generation log entries.
      items:
        $ref: "#/components/schemas/LogEntry"
